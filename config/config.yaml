# ============================================================================
# API Providers
# ============================================================================
providers:
  enabled:
    - openai
    - google
    - groq
  
  disabled:
    - anthropic

  default: openai

# ============================================================================
# Default LLM Parameters
# ============================================================================
defaults:
  temperature: 0.2
  max_tokens: 1000
  top_p: 1.0
  
  # Parameter recommendations by task type
  by_task:
    extraction:
      temperature: 0.0
      max_tokens: 500
    
    classification:
      temperature: 0.0
      max_tokens: 50
    
    generation:
      temperature: 0.7
      max_tokens: 1500
    
    reasoning:
      temperature: 0.3
      max_tokens: 2000
    
    creative:
      temperature: 1.0
      max_tokens: 2000